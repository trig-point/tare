name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Catches missing source files and supplies history for the secret scan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Catches package-manager drift using packageManager from package.json.
      - uses: pnpm/action-setup@v4
      # Catches runtime drift by installing the supported Node version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Catches dependency manifests that disagree with the lockfile.
      - run: pnpm install --frozen-lockfile
      # Catches lint errors and inconsistent formatting.
      - run: pnpm lint
      # Catches TypeScript type errors across workspaces.
      - run: pnpm typecheck
      # Catches health, configuration and migration regressions.
      - run: pnpm test
      # Catches stale and untracked generated query files.
      - run: pnpm generate && git add -N packages/engine/src/queries && git diff --exit-code HEAD -- packages/engine/src/queries
      # Catches missing custom rules outside fork PRs.
      - name: Check gitleaks configuration
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.TARE_GITLEAKS_TOML }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$GITLEAKS_CONFIG_TOML" ]; then
            if [ "$FORK_PULL_REQUEST" = true ]; then
              echo "::warning::Custom gitleaks rules unavailable for fork PR."
            else
              echo "::error::TARE_GITLEAKS_TOML is required."
              exit 1
            fi
          fi
      # Catches personal names, hosts, secrets and tampered scanner downloads.
      - name: Scan with gitleaks
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.TARE_GITLEAKS_TOML }}
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks_8.28.0_linux_x64.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks_8.28.0_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks_8.28.0_linux_x64.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --exit-code 1
