name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Catches missing source files and supplies history for the secret scan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Catches package-manager drift using packageManager from package.json.
      - uses: pnpm/action-setup@v4
      # Catches runtime drift by installing the supported Node version.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Catches dependency manifests that disagree with the lockfile.
      - run: pnpm install --frozen-lockfile
      # Catches lint errors and inconsistent formatting.
      - run: pnpm lint
      # Catches TypeScript type errors across workspaces.
      - run: pnpm typecheck
      # Catches health, configuration and migration regressions.
      - run: pnpm test
      # Catches stale and untracked generated query files.
      - run: pnpm generate && git add -N packages/engine/src/queries && git diff --exit-code -- packages/engine/src/queries
      # Catches committed secrets and tampered scanner downloads.
      - run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks_8.28.0_linux_x64.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks_8.28.0_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks_8.28.0_linux_x64.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --exit-code 1
