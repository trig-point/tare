name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Catches missing source files and supplies history for the secret scan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Catches package-manager drift using packageManager from package.json.
      - uses: pnpm/action-setup@v4
      # Catches runtime drift by installing the supported Node version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Catches dependency manifests that disagree with the lockfile.
      - run: pnpm install --frozen-lockfile
      # Catches lint errors and inconsistent formatting.
      - run: pnpm lint
      # Catches TypeScript type errors across workspaces.
      - run: pnpm typecheck
      # Catches health, configuration and migration regressions.
      - run: pnpm test
      # Catches stale and untracked generated query files.
      - run: pnpm generate && git add -N packages/engine/src/queries && git diff --exit-code HEAD -- packages/engine/src/queries
      # Catches missing custom rules outside secretless runs.
      - name: Check gitleaks configuration
        env:
          TARE_GITLEAKS_TOML: ${{ secrets.TARE_GITLEAKS_TOML }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Dependabot runs cannot access ordinary Actions secrets.
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          if [ "$FORK_PULL_REQUEST" = true ] || [ "$DEPENDABOT" = true ]; then
            echo "::warning::Custom gitleaks rules unavailable; using default rules."
          elif [ -z "$TARE_GITLEAKS_TOML" ]; then
            echo "::error::TARE_GITLEAKS_TOML is required."
            exit 1
          fi
      # Catches personal names, hosts, secrets and tampered scanner downloads.
      - name: Scan with gitleaks
        env:
          TARE_GITLEAKS_TOML: ${{ secrets.TARE_GITLEAKS_TOML }}
          SECRETLESS: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          set -euo pipefail
          umask 077
          unset GITLEAKS_CONFIG_TOML GITLEAKS_CONFIG
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          if [ "$SECRETLESS" = true ]; then
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          else
            printf '%s\n' "$TARE_GITLEAKS_TOML" > "$RUNNER_TEMP/gitleaks.toml"
            canary_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-canary.XXXXXX")
            printf '%s%s\n' 'tare-gitleaks-' 'canary-7d41e2' > "$canary_dir/probe.txt"
            canary_status=0
            "$RUNNER_TEMP/gitleaks" dir "$canary_dir" --config "$RUNNER_TEMP/gitleaks.toml" --redact --exit-code 1 > "$RUNNER_TEMP/gitleaks-canary.log" 2>&1 || canary_status=$?
            if [ "$canary_status" -ne 1 ] || ! grep -qE 'leaks found: [1-9][0-9]*' "$RUNNER_TEMP/gitleaks-canary.log"; then
              echo "::error::custom gitleaks rules did not load."
              exit 1
            fi
            echo "Custom gitleaks canary passed."
          fi
          default_probe_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-default.XXXXXX")
          printf '%s%s\n' 'ghp_' 'aB3dE5fG7hI9jK1mN3pQ5rS7tU9vW1xY3zA5' > "$default_probe_dir/probe.txt"
          default_probe_status=0
          "$RUNNER_TEMP/gitleaks" dir "$default_probe_dir" --config "$RUNNER_TEMP/gitleaks.toml" --redact --exit-code 1 > "$RUNNER_TEMP/gitleaks-default.log" 2>&1 || default_probe_status=$?
          if [ "$default_probe_status" -ne 1 ] || ! grep -qE 'leaks found: [1-9][0-9]*' "$RUNNER_TEMP/gitleaks-default.log"; then
            echo "::error::default gitleaks rules did not load."
            exit 1
          fi
          echo "Default gitleaks probe passed."
          scan_status=0
          "$RUNNER_TEMP/gitleaks" git . --config "$RUNNER_TEMP/gitleaks.toml" --redact --exit-code 1 > "$RUNNER_TEMP/gitleaks.log" 2>&1 || scan_status=$?
          summary=$(grep -oE '[0-9]+ commits scanned|no leaks found|leaks found: [0-9]+|scanned ~[0-9.]+ ?(bytes|KB|MB|GB)' "$RUNNER_TEMP/gitleaks.log" || true)
          if [ -n "$summary" ]; then
            printf '%s\n' "$summary"
          elif [ "$scan_status" -ne 0 ]; then
            echo "::error::gitleaks failed; run it locally with the config to see why."
          fi
          exit "$scan_status"
