name: API drift
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: api-drift
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check vendor APIs
        id: drift
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: node packages/engine/scripts/api-drift-check.mts
      - name: Report Open Food Facts drift
        if: ${{ failure() && steps.drift.outputs.off_drift == 'true' }}
        uses: ovsds/create-or-update-unique-issue-action@e5d7437e9f6acd688d3b09834d0494a732d87d2d # v1.1.1
        with:
          title: "[api-drift] Open Food Facts"
          unique-title-includes: "[api-drift] Open Food Facts"
          body: ${{ steps.drift.outputs.off_body }}
      - name: Report USDA drift
        if: ${{ failure() && steps.drift.outputs.usda_drift == 'true' }}
        uses: ovsds/create-or-update-unique-issue-action@e5d7437e9f6acd688d3b09834d0494a732d87d2d # v1.1.1
        with:
          title: "[api-drift] USDA FoodData Central"
          unique-title-includes: "[api-drift] USDA FoodData Central"
          body: ${{ steps.drift.outputs.usda_body }}
