services:
  tare:
    build: .
    image: tare:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: /data/tare.sqlite
      PORT: "3000"
      TARE_TIMEZONE: ${TARE_TIMEZONE-UTC}
      TARE_TARGET_WEEKDAY: ${TARE_TARGET_WEEKDAY:-monday}
      TARE_TDEE_WINDOW_DAYS: ${TARE_TDEE_WINDOW_DAYS:-}
      TARE_TDEE_ENERGY_DENSITY: ${TARE_TDEE_ENERGY_DENSITY:-}
      TARE_TDEE_MIN_SIGNED_DAYS: ${TARE_TDEE_MIN_SIGNED_DAYS:-}
      TARE_TDEE_MIN_WEIGH_IN_DAYS: ${TARE_TDEE_MIN_WEIGH_IN_DAYS:-}
      TARE_TDEE_MIN_SPAN_DAYS: ${TARE_TDEE_MIN_SPAN_DAYS:-}
      TARE_TDEE_DEFAULT_RANGE: ${TARE_TDEE_DEFAULT_RANGE:-}
      TARE_WHY_BASELINE_DAYS: ${TARE_WHY_BASELINE_DAYS:-}
      TARE_WHY_MIN_BASELINE_DAYS: ${TARE_WHY_MIN_BASELINE_DAYS:-}
      TARE_WHY_DEVIATIONS: ${TARE_WHY_DEVIATIONS:-}
      TARE_WHY_HRV_PERCENT: ${TARE_WHY_HRV_PERCENT:-}
      TARE_WHY_LATE_HOURS: ${TARE_WHY_LATE_HOURS:-}
      TARE_WHY_LATE_MINUTES: ${TARE_WHY_LATE_MINUTES:-}
      TARE_ORDER_MODEL_BASE_URL: ${TARE_ORDER_MODEL_BASE_URL:-}
      TARE_ORDER_MODEL: ${TARE_ORDER_MODEL:-}
      TARE_ORDER_MODEL_API_KEY: ${TARE_ORDER_MODEL_API_KEY:-}
      TARE_ORDER_EMAIL_SERVICES: ${TARE_ORDER_EMAIL_SERVICES:-}
      TARE_PUBLIC_URL: ${TARE_PUBLIC_URL:-}
      TARE_SESSION_DAYS: ${TARE_SESSION_DAYS:-30}
      TARE_BACKUP_DIR: /backups
      TARE_BACKUP_KEEP: ${TARE_BACKUP_KEEP:-7}
      TARE_ADMIN_USERNAME: ${TARE_ADMIN_USERNAME:-}
      TARE_ADMIN_PASSWORD: ${TARE_ADMIN_PASSWORD:-}
      TARE_ADMIN_ACCESS_EMAIL: ${TARE_ADMIN_ACCESS_EMAIL:-}
      TARE_ACCESS_TEAM_DOMAIN: ${TARE_ACCESS_TEAM_DOMAIN:-}
      TARE_ACCESS_AUD: ${TARE_ACCESS_AUD:-}
      TARE_MCP_ALLOWED_ORIGINS: ${TARE_MCP_ALLOWED_ORIGINS:-}
      TARE_USDA_API_KEY: ${TARE_USDA_API_KEY:-}
      TARE_OFF_USER_AGENT: ${TARE_OFF_USER_AGENT:-}
      TARE_OURA_CLIENT_ID: ${TARE_OURA_CLIENT_ID:-}
      TARE_OURA_CLIENT_SECRET: ${TARE_OURA_CLIENT_SECRET:-}
      TARE_OURA_REDIRECT_URL: ${TARE_OURA_REDIRECT_URL:-}
      TARE_OURA_TOKEN_KEY: ${TARE_OURA_TOKEN_KEY:-}
    volumes:
      - tare-data:/data
      - tare-backups:/backups
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  tare-data:
  tare-backups:
